version: 2
updates:
  # Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']

  # Coding standards tools (development only; nothing from Composer ships in the plugin).
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    groups:
      coding-standards:
        patterns: ['*']
