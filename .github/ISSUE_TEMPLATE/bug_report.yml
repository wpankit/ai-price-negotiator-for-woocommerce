name: Bug report
description: Something in the plugin doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For questions about setting up or using the plugin, please use the [support forum](https://wordpress.org/support/plugin/ai-price-negotiator-for-woocommerce/). Security issues go through the [security policy](https://github.com/wpankit/ai-price-negotiator-for-woocommerce/security/policy), not here.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add two products to the cart and go to checkout.
        2. Click "Make an Offer" and offer $50.
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: checkout
    attributes:
      label: Which checkout does the store use?
      options:
        - Checkout block
        - Classic checkout (shortcode)
        - Not related to checkout
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: e.g. 0.0.2
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: WordPress, WooCommerce and PHP versions
      placeholder: e.g. WordPress 7.1, WooCommerce 11.1, PHP 8.3
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Errors or logs
      description: Browser console errors, PHP errors from debug.log, or failed network requests. Please remove your OpenAI API key and any customer details first.
      render: shell
